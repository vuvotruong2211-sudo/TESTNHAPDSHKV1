<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
      color: #1a1a1a;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
    .header {
      background: #0b5ed7;
      color: white;
      padding: 18px 16px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }
    .header small { display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:4px;}
    .tabs { display: flex; margin: 16px 0; background:#fff; border-radius: 10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
    .tab {
      flex: 1; text-align: center; padding: 12px 0; cursor: pointer;
      font-weight: 600; font-size: 14px; color:#666; border-bottom: 3px solid transparent;
    }
    .tab.active { color: #0b5ed7; border-bottom: 3px solid #0b5ed7; background:#eaf2ff; }
    .card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom:16px;}
    .field { margin-bottom: 14px; }
    label { display:block; font-size: 13px; font-weight:600; margin-bottom:6px; color:#333; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #d7dbe0; border-radius: 8px;
      font-size: 15px; background:#fbfbfc;
    }
    textarea { resize: vertical; min-height: 60px; }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 8px; background: #0b5ed7;
      color: white; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
    }
    .btn:disabled { background:#a9c4ea; }
    .btn.secondary { background:#fff; color:#0b5ed7; border:1px solid #0b5ed7; }
    .msg { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:12px; display:none; }
    .msg.ok { background:#e6f4ea; color:#1e7e34; display:block;}
    .msg.err { background:#fdecec; color:#c0392b; display:block;}
    .result-item { border:1px solid #e5e7eb; border-radius:8px; padding:12px; margin-bottom:10px; font-size:14px; }
    .result-item .row { display:flex; justify-content:space-between; padding:3px 0; }
    .result-item .row span:first-child { color:#666; }
    .badge { padding:2px 8px; border-radius:12px; font-size:12px; font-weight:700; }
    .badge.done { background:#e6f4ea; color:#1e7e34; }
    .badge.pending { background:#fff4e5; color:#b9770e; }
    .hint { font-size:12px; color:#888; margin-top:2px; }
    .footer-note { text-align:center; font-size:11px; color:#999; margin-top:20px; }
  </style>
</head>
<body>
  <div class="header">
    ĐẶT CHỖ XE KHÁCH
    <small>Tuyến HCM – Quảng Ngãi / HCM – Đà Lạt</small>
  </div>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" id="tabDat" onclick="showTab('dat')">Nhập thông tin</div>
      <div class="tab" id="tabTra" onclick="showTab('tra')">Tra kết quả</div>
    </div>

    <!-- FORM ĐẶT CHỖ -->
    <div id="panelDat" class="card">
      <div id="msgDat" class="msg"></div>
      <div class="field">
        <label>Số điện thoại *</label>
        <input type="tel" id="sdt" placeholder="09xxxxxxxx" required>
      </div>
      <div class="field">
        <label>Họ và tên *</label>
        <input type="text" id="hoTen" placeholder="Nguyễn Văn A" required>
      </div>
      <div class="field">
        <label>Ngày đi *</label>
        <input type="date" id="ngayDi" required>
      </div>
      <div class="field">
        <label>Tuyến *</label>
        <select id="tuyen" required>
          <option value="">-- Chọn tuyến --</option>
          <option value="HCM-QN">HCM → Quảng Ngãi</option>
          <option value="QN-HCM">Quảng Ngãi → HCM</option>
          <option value="HCM-DL">HCM → Đà Lạt</option>
          <option value="DL-HCM">Đà Lạt → HCM</option>
        </select>
      </div>
      <div class="field">
        <label>Số lượng khách *</label>
        <input type="number" id="slKhach" min="1" value="1" required>
      </div>
      <div class="field">
        <label>Yêu cầu (nếu có)</label>
        <textarea id="yeuCau" placeholder="Ví dụ: cần đón tại nhà, ghế gần cửa..."></textarea>
      </div>
      <button class="btn" id="btnSubmit" onclick="submitForm()">GỬI THÔNG TIN ĐẶT CHỖ</button>
      <div class="hint">Sau khi gửi, vui lòng lưu số điện thoại để tra kết quả xử lý.</div>
    </div>

    <!-- TRA KẾT QUẢ -->
    <div id="panelTra" class="card" style="display:none;">
      <div id="msgTra" class="msg"></div>
      <div class="field">
        <label>Nhập số điện thoại đã đặt chỗ</label>
        <input type="tel" id="sdtTra" placeholder="09xxxxxxxx">
      </div>
      <button class="btn secondary" id="btnLookup" onclick="lookup()">TRA KẾT QUẢ</button>
      <div id="resultList" style="margin-top:14px;"></div>
    </div>

    <div class="footer-note">Mã nhân viên phụ trách: <b id="nvDisplay">...</b></div>
  </div>

  <script>
    // ⚠️ THAY URL DƯỚI ĐÂY bằng URL Web App Apps Script của anh (kết thúc bằng /exec)
    const API_URL = "https://script.google.com/macros/s/1lgCoda45qt-Nctlv8PTzVWA4msKSCpEo5Qco1NV3piM/exec";

    // Lấy mã nhân viên từ query string trên chính link GitHub Pages, ví dụ:
    // https://vuvotruong2211-sudo.github.io/?nv=NV001
    const urlParams = new URLSearchParams(window.location.search);
    const NHAN_VIEN = urlParams.get('nv') || 'CHUA_GAN';
    document.getElementById('nvDisplay').textContent = NHAN_VIEN;

    function showTab(tab) {
      document.getElementById('tabDat').classList.toggle('active', tab === 'dat');
      document.getElementById('tabTra').classList.toggle('active', tab === 'tra');
      document.getElementById('panelDat').style.display = tab === 'dat' ? 'block' : 'none';
      document.getElementById('panelTra').style.display = tab === 'tra' ? 'block' : 'none';
    }

    function showMsg(elId, text, ok) {
      const el = document.getElementById(elId);
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.textContent = text;
      el.style.display = 'block';
    }

    function submitForm() {
      const sdt = document.getElementById('sdt').value.trim();
      const hoTen = document.getElementById('hoTen').value.trim();
      const ngayDi = document.getElementById('ngayDi').value;
      const tuyen = document.getElementById('tuyen').value;
      const slKhach = document.getElementById('slKhach').value;
      const yeuCau = document.getElementById('yeuCau').value.trim();

      if (!sdt || !hoTen || !ngayDi || !tuyen || !slKhach) {
        showMsg('msgDat', 'Vui lòng điền đầy đủ thông tin bắt buộc (*)', false);
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tránh preflight CORS
        body: JSON.stringify({
          nhanVien: NHAN_VIEN,
          sdt: sdt,
          hoTen: hoTen,
          ngayDi: ngayDi,
          tuyen: tuyen,
          slKhach: slKhach,
          yeuCau: yeuCau
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'GỬI THÔNG TIN ĐẶT CHỖ';
          if (res.ok) {
            showMsg('msgDat', res.message, true);
            document.getElementById('hoTen').value = '';
            document.getElementById('ngayDi').value = '';
            document.getElementById('tuyen').value = '';
            document.getElementById('slKhach').value = 1;
            document.getElementById('yeuCau').value = '';
          } else {
            showMsg('msgDat', res.message || 'Có lỗi xảy ra', false);
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'GỬI THÔNG TIN ĐẶT CHỖ';
          showMsg('msgDat', 'Không kết nối được server: ' + err.message, false);
        });
    }

    function lookup() {
      const sdt = document.getElementById('sdtTra').value.trim();
      if (!sdt) {
        showMsg('msgTra', 'Vui lòng nhập số điện thoại', false);
        return;
      }
      document.getElementById('resultList').innerHTML = '';
      document.getElementById('msgTra').style.display = 'none';
      const btn = document.getElementById('btnLookup');
      btn.disabled = true;
      btn.textContent = 'Đang tra...';

      fetch(API_URL + '?action=lookup&sdt=' + encodeURIComponent(sdt))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'TRA KẾT QUẢ';
          if (!res.ok || !res.data || res.data.length === 0) {
            showMsg('msgTra', 'Không tìm thấy thông tin đặt chỗ với số điện thoại này.', false);
            return;
          }
          renderResults(res.data);
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'TRA KẾT QUẢ';
          showMsg('msgTra', 'Không kết nối được server: ' + err.message, false);
        });
    }

    function renderResults(results) {
      const container = document.getElementById('resultList');
      container.innerHTML = results.map(function (r) {
        const isDone = r.tinhTrang === 'ĐÃ XỬ LÝ';
        return '<div class="result-item">' +
          '<div class="row"><span>Họ tên</span><span>' + (r.hoTen || '') + '</span></div>' +
          '<div class="row"><span>Ngày đi</span><span>' + (r.ngayDi || '') + '</span></div>' +
          '<div class="row"><span>Tuyến</span><span>' + (r.tuyen || '') + '</span></div>' +
          '<div class="row"><span>SL khách</span><span>' + (r.slKhach || '') + '</span></div>' +
          '<div class="row"><span>Yêu cầu</span><span>' + (r.yeuCau || '-') + '</span></div>' +
          '<div class="row"><span>Tình trạng</span><span class="badge ' + (isDone ? 'done' : 'pending') + '">' + (r.tinhTrang || 'CHƯA XỬ LÝ') + '</span></div>' +
          '<div class="row"><span>Số giường/phòng</span><span>' + (r.giuong || '-') + '</span></div>' +
          '<div class="row"><span>Tổng tiền</span><span>' + (r.tongTien ? Number(r.tongTien).toLocaleString('vi-VN') + ' đ' : '-') + '</span></div>' +
          '</div>';
      }).join('');
    }
  </script>
</body>
</html>
